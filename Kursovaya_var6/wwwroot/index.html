<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Музыкальные группы</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
        }

        .card {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Музыкальные группы</h2>

        <div class="card p-3">

            <div class="row">

                <div class="col-md-5">
                    <input id="search" class="form-control" placeholder="Поиск">
                </div>

                <div class="col-md-4">
                    <select id="sort" class="form-select">

                        <option value="">Без сортировки</option>

                        <option value="group_asc">Группа ↑</option>
                        <option value="group_desc">Группа ↓</option>

                        <option value="leader_asc">Лидер ↑</option>
                        <option value="leader_desc">Лидер ↓</option>

                        <option value="albums_asc">Альбомы ↑</option>
                        <option value="albums_desc">Альбомы ↓</option>

                        <option value="genre_asc">Жанр ↑</option>
                        <option value="genre_desc">Жанр ↓</option>

                    </select>
                </div>

                <div class="col-md-3">
                    <button class="btn btn-primary w-100" onclick="loadData()">Применить</button>
                </div>

            </div>

            <button class="btn btn-secondary mt-2" onclick="resetFilters()">Сброс</button>

        </div>

        <div class="card p-3">

            <div class="row">

                <div class="col-md-3">
                    <input id="groupName" class="form-control" placeholder="Группа">
                </div>

                <div class="col-md-3">
                    <input id="leader" class="form-control" placeholder="Лидер">
                </div>

                <div class="col-md-3">
                    <input id="genre" class="form-control" placeholder="Жанр">
                </div>

                <div class="col-md-3">
                    <input id="albums" type="number" class="form-control" placeholder="Альбомы">
                </div>

            </div>

            <button class="btn btn-success mt-3" onclick="addBand()">Добавить</button>

        </div>

        <div class="card p-3">

            <div class="row">

                <div class="col-md-4">
                    <input id="min" type="number" class="form-control" placeholder="Мин">
                </div>

                <div class="col-md-4">
                    <input id="max" type="number" class="form-control" placeholder="Макс">
                </div>

                <div class="col-md-4">
                    <button class="btn btn-warning w-100" onclick="countRange()">Посчитать</button>
                </div>

            </div>
            
            <div id="countResult"></div>

        </div>

        <div class="card p-3">

            <table class="table table-bordered">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Группа</th>
                        <th>Лидер</th>
                        <th>Альбомы</th>
                        <th>Жанр</th>
                        <th>Действие</th>
                    </tr>
                </thead>

                <tbody id="tableBody"></tbody>

            </table>

        </div>

    </div>

    <script>

        const API = "/api/bands";

        async function loadData() {

            const search = document.getElementById("search").value;
            const sort = document.getElementById("sort").value;

            let url = API;

            let params = [];

            if (search) params.push(`search=${search}`);
            if (sort) params.push(`sort=${sort}`);

            if (params.length > 0) {
                url += "?" + params.join("&");
            }

            const response = await fetch(url);
            const data = await response.json();

            let html = "";

            data.forEach(b => {
                html += `
                <tr>
                    <td>${b.id}</td>
                    <td>${b.groupName.name}</td>
                    <td>${b.leader.name}</td>
                    <td>${b.albumsCount}</td>
                    <td>${b.genre.name}</td>
                    <td>
                        <button class="btn btn-danger btn-sm" onclick="deleteBand(${b.id})">Удалить</button>
                    </td>
                </tr>
            `;
            });

            document.getElementById("tableBody").innerHTML = html;
        }

        async function addBand() {

            const groupName = document.getElementById("groupName").value.trim();
            const leader = document.getElementById("leader").value.trim();
            const genre = document.getElementById("genre").value.trim();
            const albums = document.getElementById("albums").value;

            if (
                groupName === "" ||
                leader === "" ||
                genre === "" ||
                albums === ""
            ) {
                alert("Заполните все поля");
                return;
            }

            const band = {
                groupName: groupName,
                leader: leader,
                genre: genre,
                albumsCount: Number(albums)
            };

            await fetch(API, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(band)
            });

            document.getElementById("groupName").value = "";
            document.getElementById("leader").value = "";
            document.getElementById("genre").value = "";
            document.getElementById("albums").value = "";

            loadData();
        }

        async function deleteBand(id) {

            const ok = confirm("Вы уверены, что хотите удалить эту группу?");

            if (!ok) {
                return;
            }

            await fetch(`${API}/${id}`, {
                method: "DELETE"
            });

            loadData();
        }

        async function countRange() {

            const min = document.getElementById("min").value;
            const max = document.getElementById("max").value;

            const response = await fetch(`${API}/count?min=${min}&max=${max}`);
            const result = await response.text();

            document.getElementById("countResult").innerText = "Количество групп: " + result;
        }

        function resetFilters() {

            document.getElementById("search").value = "";
            document.getElementById("sort").value = "";

            loadData();
        }

        loadData();

    </script>

</body>
</html>
